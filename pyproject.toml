[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cervixagent"
version = "0.2.0"
description = "Terminal-first workflow agent for the fixed CervixAgent research protocol."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CervixAgent Project" }]
dependencies = []

[project.optional-dependencies]
chem = [
  "rdkit==2026.3.3",
  "gemmi==0.7.5",
  "numpy==2.5.1",
  "Pillow==12.3.0",
]

[project.scripts]
cervixagent = "cervixagent.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cervixagent = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
